<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Import ZIP archives into Unreal Engine's Content Browser. Preserve folder structure, process nested ZIP archives, and reimport assets from the original archive.">
<title>ZipImporter Documentation</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#0e131b;--raised:#151d29;--line:#273241;--text:#e8eef7;--muted:#9aa8ba;--dim:#718096;--accent:#91caff;--blue:#4ba3ff;--head:68px;--side:248px}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(var(--head) + 12px);background:radial-gradient(ellipse 65% 34% at 50% -15%,rgba(53,111,171,.14),transparent 70%),var(--bg);color:var(--text);font:15px/1.75 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}a{color:var(--accent);text-decoration:none}a:hover{color:#d3e9ff}button,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:30;height:var(--head);border-bottom:1px solid #293444;background:rgba(9,11,16,.9);backdrop-filter:blur(18px)}.bar{height:100%;max-width:1680px;margin:auto;padding:0 30px;display:flex;align-items:center;gap:15px}.brand{display:flex;align-items:center;color:var(--text);min-width:0}.brand strong{display:block;font-size:18px;font-weight:760;letter-spacing:-.025em;line-height:1.2}.spacer{flex:1}.langs{display:flex;gap:3px;padding:4px;border:1px solid var(--line);border-radius:10px;background:#0d1118}.langs button{padding:6px 11px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--muted);font-size:12px;cursor:pointer}.langs button[aria-pressed=true]{border-color:#2d4d6b;background:#1a2e42;color:#eef7ff}.langs button:hover{color:white}.github{display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid #354456;border-radius:9px;background:linear-gradient(#171f2b,#10151d);color:#e4edf8;font-size:12px;font-weight:650}.github svg{width:16px;height:16px}.menu{display:none;width:38px;height:38px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.layout{display:grid;grid-template-columns:var(--side) minmax(0,820px);gap:48px;max-width:1680px;margin:auto;padding:29px 30px 85px;align-items:start}.sidebar{position:sticky;top:calc(var(--head) + 20px);max-height:calc(100vh - var(--head) - 40px);overflow-y:auto;padding:5px 8px 22px 0;scrollbar-width:thin;scrollbar-color:#334155 transparent}.search-wrap{display:block;margin:0 0 25px}.search{width:100%;height:40px;padding:0 13px;border:1px solid var(--line);border-radius:9px;outline:none;background:#0c1017;color:var(--text);font-size:12px}.search::placeholder{color:#78869a}.search:focus{border-color:#477eae;box-shadow:0 0 0 3px #4ba3ff1a}.navgroup{margin-bottom:6px}.navlink{display:flex;align-items:center;gap:10px;min-height:35px;padding:6px 12px;border-radius:8px;color:#aebaca;font-size:12px;line-height:1.45}.navlink:before{content:"";width:5px;height:5px;flex:0 0 5px;border:1px solid #526176;border-radius:50%}.navlink:hover{background:#131a24;color:#f1f7ff}.navlink.active{background:#4ba3ff20;color:#dceeff;font-weight:650}.navlink.active:before{border-color:var(--blue);background:var(--blue);box-shadow:0 0 0 3px #4ba3ff1a}.navlink.level3{margin-left:17px;min-height:31px;padding:5px 10px;color:#8e9caf;font-size:11px}.navlink.level3:before{width:4px;height:4px;flex-basis:4px;border:0;background:#3d4a5e}.navlink.level3.active{background:transparent;color:#d1e7ff}.empty{padding:8px 12px;color:var(--dim);font-size:12px}
main{min-width:0}.article{min-width:0;padding:6px 0 35px;color:#c7d0df;overflow-wrap:anywhere}.article>h1:first-child{margin:7px 0 14px;color:#f3f7fc;font-size:clamp(34px,4vw,46px);line-height:1.13;letter-spacing:-.045em;font-weight:780}.article>h1:first-child+p{margin-top:0;color:#d7e0ed;font-size:17px;line-height:1.7}.article>h1:first-child+p+p{color:#a1adbd;font-size:14px}.article h2,.article h3{line-height:1.35}.article h2{margin:53px 0 19px;padding-bottom:13px;border-bottom:1px solid var(--line);color:#f0f5fc;font-size:27px;letter-spacing:-.025em;font-weight:720}.article h3{margin:34px 0 12px;color:#e5edf8;font-size:19px;font-weight:680}.article p{margin:12px 0 17px}.article ul,.article ol{margin:12px 0 21px;padding-left:25px}.article li{padding-left:3px;margin:5px 0}.article li::marker{color:#71839a}.article strong{color:#eff5fd;font-weight:680}.article a{text-decoration:underline;text-decoration-color:#8bc6ff55;text-underline-offset:3px}.article img{display:block;max-width:100%;height:auto;margin:23px auto 29px;border:1px solid #293444;border-radius:12px;background:#0d1118;box-shadow:0 18px 60px #0004}.article code{padding:.2em .4em;border:1px solid #283444;border-radius:5px;background:#131a24;color:#d5e9ff;font:.88em ui-monospace,SFMono-Regular,Consolas,monospace}.article pre{max-width:100%;overflow:auto;margin:17px 0 24px;padding:17px 19px;border:1px solid #293545;border-radius:11px;background:#0d121a}.article pre code{padding:0;border:0;background:transparent;color:#c5d4e6;font-size:13px;line-height:1.7}.article table{display:block;width:100%;overflow:auto;margin:20px 0 28px;border:1px solid #2b3544;border-radius:10px;border-spacing:0;border-collapse:separate}.article th,.article td{min-width:120px;padding:10px 14px;border-right:1px solid #283342;border-bottom:1px solid #283342;text-align:left}.article th{background:#151c27;color:#eef4fc}.article tr:last-child td{border-bottom:0}.article th:last-child,.article td:last-child{border-right:0}.article hr{height:1px;margin:30px 0;border:0;background:var(--line)}
.footer{margin-top:40px;padding:22px 0 10px;border-top:1px solid #252f3d;color:#778599;font-size:12px}.footer a{color:#a2cfff}.backdrop{display:none}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:1320px){.layout{grid-template-columns:225px minmax(0,820px);gap:35px}}@media(max-width:880px){:root{--head:62px}.bar{padding:0 16px;gap:10px}.menu{display:inline-flex}.brand small{display:none}.layout{display:block;max-width:800px;padding:22px 22px 60px}.sidebar{position:fixed;z-index:45;left:0;top:var(--head);bottom:0;width:min(310px,88vw);max-height:none;overflow:auto;padding:22px 20px 28px;background:#0c1017;border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .22s}.nav-open .sidebar{transform:translateX(0)}.backdrop{display:block;position:fixed;z-index:40;inset:var(--head) 0 0;border:0;background:#0009;opacity:0;visibility:hidden}.nav-open .backdrop{opacity:1;visibility:visible}.article h2{margin-top:43px;font-size:25px}}@media(max-width:540px){.bar{padding:0 11px;gap:8px}.brand{gap:8px}.brand strong{font-size:13px}.mark{grid-template-columns:repeat(3,4px);gap:2px;padding:7px}.mark i{width:4px;height:4px}.langs button{padding:6px 8px;font-size:11px}.github{width:36px;height:36px;justify-content:center;padding:0;font-size:0}.github svg{width:17px;height:17px}.layout{padding:18px 16px 50px}.article{font-size:14px;line-height:1.75}.article>h1:first-child{font-size:33px}.article>h1:first-child+p{font-size:15px}.article h2{font-size:23px}.article h3{font-size:18px}.article pre{padding:13px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition-duration:.01ms!important}}
</style>
</head>
<body>
<header><div class="bar">
<button class="menu" id="menu" type="button" aria-label="Open navigation" aria-expanded="false"><svg viewBox="0 0 24 24" width="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<a class="brand" href="./"><strong>ZipImporter</strong></a>
<div class="spacer"></div><div class="langs"><button id="en" aria-pressed="true">English</button><button id="ru" aria-pressed="false">Русский</button></div>

</div></header>
<button class="backdrop" id="backdrop" type="button" aria-label="Close navigation"></button>
<div class="layout">
<aside class="sidebar" id="sidebar" aria-label="Documentation navigation">
<label class="search-wrap"><span class="sr" id="search-label">Search sections</span><input class="search" id="search" type="search" placeholder="Search sections..." autocomplete="off"></label><nav id="nav"></nav></aside>
<main><article id="content" class="article"><p>Loading documentation…</p></article><footer class="footer"><span id="footer-text">ZipImporter documentation</span> · <a href="https://github.com/DontFWithTheJ/UnrealEngineZipImporter">GitHub</a></footer></main>

</div>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script>
const content=document.getElementById('content'),nav=document.getElementById('nav'),search=document.getElementById('search'),menu=document.getElementById('menu'),backdrop=document.getElementById('backdrop');
const buttons={en:document.getElementById('en'),ru:document.getElementById('ru')};
const labels={en:{search:'Search sections...',searchLabel:'Search sections',footer:'ZipImporter documentation',loading:'Loading documentation…',failed:'Could not load documentation.'},ru:{search:'Поиск по разделам...',searchLabel:'Поиск по разделам',footer:'Документация ZipImporter',loading:'Загрузка документации…',failed:'Не удалось загрузить документацию.'}};
const cache={};let language='en',headings=[],links=[];
function slug(s){return s.toLocaleLowerCase().trim().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N}_\s-]/gu,'').replace(/\s+/g,'-').replace(/-+/g,'-')}
function closeMenu(){document.body.classList.remove('nav-open');menu.setAttribute('aria-expanded','false')}
function toggleMenu(){const open=!document.body.classList.contains('nav-open');document.body.classList.toggle('nav-open',open);menu.setAttribute('aria-expanded',String(open))}
let navigationTargetId=null;
function setActiveNav(id){const heading=headings.find(h=>h.id===id);const parent=heading&&heading.tagName==='H3'?headings.slice(0,headings.indexOf(heading)+1).reverse().find(h=>h.tagName==='H2'):heading;links.forEach(item=>item.a.classList.toggle('active',item.h.id===id||(item.h.tagName==='H2'&&parent&&item.h.id===parent.id)))}
function navigateToHeading(heading,link,event){event.preventDefault();closeMenu();if(location.hash!==link.hash)history.replaceState(null,'',link.hash);navigationTargetId=heading.id;setActiveNav(heading.id);const headerHeight=document.querySelector('header').getBoundingClientRect().height;const offset=headerHeight+12;const currentTop=heading.getBoundingClientRect().top;const targetTop=Math.max(0,window.scrollY+currentTop-offset);const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;if(Math.abs(currentTop-offset)<=2){navigationTargetId=null;return}if(reduced){window.scrollTo({top:targetTop,behavior:'instant'});navigationTargetId=null;updateNav();return}window.scrollTo({top:targetTop,behavior:'smooth'})}
function makeLink(h,depth,cls='navlink'){const a=document.createElement('a');a.className=cls+(depth===3?' level3':'');a.href='#'+h.id;a.textContent=h.textContent.trim();a.dataset.id=h.id;a.dataset.search=a.textContent.toLocaleLowerCase();a.addEventListener('click',event=>navigateToHeading(h,a,event));return a}
function prepare(){const name=language==='ru'?'содержание':'contents';const toc=[...content.querySelectorAll('h2')].find(h=>h.textContent.trim().toLocaleLowerCase()===name);if(toc){const list=toc.nextElementSibling,hr=list?.nextElementSibling?.tagName==='HR'?list.nextElementSibling:null;toc.remove();if(list?.tagName==='UL')list.remove();hr?.remove()}const seen=new Map();headings=[...content.querySelectorAll('h2,h3')];headings.forEach((h,i)=>{const b=slug(h.textContent)||'section-'+i,n=seen.get(b)||0;seen.set(b,n+1);h.id=n?b+'-'+n:b})}
function buildNav(){nav.replaceChildren();links=[];let group=null;headings.forEach(h=>{if(h.tagName==='H2'){group=document.createElement('div');group.className='navgroup';const a=makeLink(h,2);group.append(a);nav.append(group);links.push({h,a})}else if(group){const a=makeLink(h,3);group.append(a);links.push({h,a})}})}
function current(){const threshold=document.querySelector('header').getBoundingClientRect().height+34;let h=headings[0]||null;for(const x of headings){if(x.getBoundingClientRect().top<=threshold)h=x;else break}return h}
function updateNav(){if(!headings.length||navigationTargetId)return;const h=current();setActiveNav(h&&h.id)}
function filter(){const q=search.value.trim().toLocaleLowerCase();let found=0;nav.querySelectorAll('.navgroup').forEach(g=>{let n=0;g.querySelectorAll('.navlink').forEach(a=>{a.hidden=!!q&&!a.dataset.search.includes(q);if(!a.hidden)n++});g.hidden=!n;found+=n});let empty=nav.querySelector('.empty');if(q&&!found){if(!empty){empty=document.createElement('p');empty.className='empty';nav.append(empty)}empty.textContent=language==='ru'?'Ничего не найдено.':'No matching sections.'}else empty?.remove()}
async function show(next){language=next;document.documentElement.lang=language;try{localStorage.setItem('zipImporterLanguage',language)}catch(e){}Object.entries(buttons).forEach(([k,b])=>b.setAttribute('aria-pressed',String(k===language)));document.getElementById('search-label').textContent=labels[language].searchLabel;document.getElementById('footer-text').textContent=labels[language].footer;search.placeholder=labels[language].search;content.innerHTML='<p>'+labels[language].loading+'</p>';try{if(!cache[language]){const r=await fetch(language==='ru'?'./README.ru.md':'./README.md',{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);cache[language]=await r.text()}if(!window.marked)throw Error('Markdown renderer unavailable');content.innerHTML=window.marked.parse(cache[language]);prepare();buildNav();filter();window.scrollTo({top:0,behavior:'instant'});closeMenu();updateNav()}catch(e){content.innerHTML='<h1>ZipImporter</h1><p>'+labels[language].failed+'</p><p><a href="https://github.com/DontFWithTheJ/UnrealEngineZipImporter/blob/main/'+(language==='ru'?'README.ru.md':'README.md')+'">README on GitHub</a></p>';nav.replaceChildren()}}
buttons.en.addEventListener('click',()=>show('en'));buttons.ru.addEventListener('click',()=>show('ru'));menu.addEventListener('click',toggleMenu);backdrop.addEventListener('click',closeMenu);search.addEventListener('input',filter);search.addEventListener('keydown',e=>{if(e.key==='Enter')nav.querySelector('.navlink:not([hidden])')?.click();if(e.key==='Escape'){search.value='';filter();search.blur()}});window.addEventListener('scroll',updateNav,{passive:true});window.addEventListener('scrollend',()=>{if(!navigationTargetId)return;const target=document.getElementById(navigationTargetId);const headerHeight=document.querySelector('header').getBoundingClientRect().height;if(target&&Math.abs(target.getBoundingClientRect().top-headerHeight-12)<=14){navigationTargetId=null;updateNav()}});const cancelNavigation=()=>{if(navigationTargetId){navigationTargetId=null;updateNav()}};window.addEventListener('wheel',cancelNavigation,{passive:true});window.addEventListener('touchstart',cancelNavigation,{passive:true});window.addEventListener('resize',()=>{if(innerWidth>880)closeMenu()});document.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' '].includes(e.key))cancelNavigation();if(e.key==='Escape')closeMenu()});let preferred='en';try{preferred=localStorage.getItem('zipImporterLanguage')||'en'}catch(e){}show(preferred==='ru'?'ru':'en');
</script>
